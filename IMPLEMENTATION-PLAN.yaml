# =============================================================================
# CODE AUDIT (2026-01-26)
# =============================================================================

code_audit:
  date: 2026-01-26
  summary: |
    Comprehensive audit of codebase health, integration gaps, and code quality.
    Findings prioritized by impact on gameplay and maintainability.

  critical_gaps:
    loot_generation:
      status: COMPLETE
      details: |
        Implemented treasure chest system with:
        - LootGenerator creates items from floor-based drop tables
        - ChestSystem wraps loot in trapped chests (plain 10%, ornate 70%)
        - Chest modal UI with Quick Open/Inspect/Disarm/Open/Leave
        - Thief bonuses for inspection (70%) and disarm (85%)
        - 5 trap types: Poison Needle, Falling Rock, Gas, Explosive, Alarm
        - Alarm trap triggers new combat encounter
      files:
        - systems/loot/loot_generator.gd
        - systems/loot/chest_system.gd
        - resources/chest.gd
        - resources/trap.gd
        - data/traps/trap_database.gd
        - scenes/combat/chest_modal.gd

    spell_targeting:
      status: COMPLETE
      details: |
        All spell targeting types fully implemented in combat.gd UI:
        - SINGLE_ALLY: _populate_spell_ally_target_list()
        - SINGLE_ENEMY: _populate_spell_enemy_target_list()
        - SPLASH: _populate_spell_splash_target_list()
        - ROW: _populate_spell_row_target_list()
        - COLUMN: _populate_spell_column_target_list()
        - DEAD_ALLY: _populate_spell_ally_target_list(true)
        - ALL_ALLIES, ALL_ENEMIES, SELF: Direct cast
        Note: get_spell_targets() in combat_system.gd is dead code (never called)

  code_quality_issues:
    monolithic_files:
      severity: High
      details: Large files mixing UI and logic, hard to test and maintain
      files:
        - scenes/combat/combat.gd (1320 lines)
        - scenes/town/shop.gd (1216 lines)
        - scenes/common/party_menu.gd (851 lines)
        - scenes/town/training_grounds.gd (713 lines)
      fix: Extract logic into separate system classes

    dry_violations:
      severity: Medium
      items:
        - ActiveStatus class duplicated in character.gd and monster.gd
        - Six nearly-identical _get_equipment_*_bonus() methods in character.gd lines 227-266
        - 257+ preload() calls due to broken class_name resolution
      fix:
        - Extract ActiveStatus to resources/active_status.gd
        - Refactor equipment bonus to generic method
        - Fix class_name resolution, migrate from preload()

    magic_numbers:
      severity: Medium
      examples:
        - Encounter rates hardcoded (0.4, 0.7, 0.9, 0.97) in dungeon.gd lines 445-456
        - Combat speed divisor (11 - speed) * 0.1 in combat_system.gd line 119
        - Torch range 12.0, cell size 2.0, camera height 1.6 scattered
      fix: Centralize in configuration resource or constants file

    class_name_resolution:
      severity: Medium
      status: Still broken (per known_issues section)
      impact: 257+ fragile preload() calls
      files:
        - scenes/dungeon/dungeon.gd lines 3-5
        - scenes/combat/combat.gd lines 3-7
        - Most scene files
      fix: Audit for circular dependencies, migrate to class_name

  integration_issues:
    monster_ai:
      status: Minimal
      details: |
        _execute_monster_turn() only picks random attacks.
        No tactical targeting (front vs back row).
        No spell usage by spellcaster monsters.
        No defensive action triggers.
      file: systems/combat/combat_system.gd lines 377-446

    state_inconsistency:
      status: Risk
      details: |
        Multiple overlapping state trackers:
        - GameState.in_combat (boolean)
        - GameState.current_encounter (Dictionary)
        - CombatSystem.is_active (boolean)
        - CombatSystem.waiting_for_player (boolean)
      fix: Consolidate to single source of truth

    audio_manager:
      status: Stub implemented but never called
      file: autoload/audio_manager.gd
      details: Full infrastructure exists, no scenes use it

  incomplete_implementations:
    multiple_save_slots:
      status: Backend done, no UI
      details: |
        get_save_slots() supports multiple slots.
        Only autosave slot used (hardcoded).
        No UI to select/manage slots.
      file: autoload/save_manager.gd

    dungeon_features:
      status: Not started
      missing:
        - Treasure chests
        - Traps (pit, teleport, spinner, darkness)
        - Secret doors
        - One-way doors
        - Locked doors
        - Special tiles (anti-magic, healing fountain)

  working_systems:
    verified:
      - Dungeon generation and GridMap rendering
      - Grid-based movement with collision
      - Combat turn system and initiative
      - Character leveling (XP to level up at inn)
      - Equipment system (equip/unequip/cursed handling)
      - Shop (buy/sell/upgrade/scrap/identify/uncurse)
      - Status effects system
      - Spell learning during inn rest
      - Save/load (autosave slot)
      - Party formation management
      - Character creation flow
      - Random encounters in dungeon

  prioritized_fixes:
    completed:
      - Loot generation (chest system with traps)
      - Spell targeting (all targeting types working)
      - Treasure chests (integrated with combat victory)
      - Row advancement bug (party and enemies)
      - Formation Enter key bug

    high:
      - More monsters (bosses, higher levels)
