# =============================================================================
# PHASE 2: DUNGEON (NEEDS REFACTOR)
# =============================================================================

phase_2:
  name: Dungeon
  status: Complete - refactored to pure GridMap architecture

  completed:
    - Pure GridMap rendering (6 GridMaps)
    - Procedural generation algorithm
    - Grid-based movement with proper tile centering
    - Wall collision detection
    - Stairs up/down detection
    - Floor caching via GameState
    - Scene-based floor transitions via SceneManager
    - OmniLight torch atmosphere
    - Ceiling tiles
    - 30fps frame limiter

  architecture:
    rendering:
      approach: 6 GridMaps (1 item per cell limitation)
      gridmaps:
        - FloorGridMap: floor tiles + stairs markers
        - CeilingGridMap: ceiling tiles
        - NorthWallGridMap: north-facing walls
        - SouthWallGridMap: south-facing walls
        - EastWallGridMap: east-facing walls
        - WestWallGridMap: west-facing walls
      mesh_libraries: Created programmatically in _setup_grid_maps()
      cell_size: 2.0 x 2.0 x 2.0 meters

    camera:
      positioning: Cell center (grid_pos * CELL_SIZE + CELL_SIZE/2)
      height: 1.6 meters
      fov: 75 degrees

    lighting:
      player_light: OmniLight3D attached to camera
      range: 12 meters
      ambient: Dark (0.05, 0.05, 0.08) at 0.3 energy

    floor_transitions:
      method: SceneManager.go_to_dungeon(floor_num, spawn_at_stairs_up)
      caching: GameState.dungeon_floors dictionary
      spawn: Based on GameState.dungeon_spawn_at_stairs_up flag

    files:
      - scenes/dungeon/dungeon.tscn
      - scenes/dungeon/dungeon.gd
      - systems/dungeon/dungeon_generator.gd
      - resources/dungeon_tile.gd
      - resources/dungeon_room.gd
      - resources/dungeon_data.gd

  resolved_questions:
    wall_positioning:
      decision: Cell edge (confirmed by existing code)
      rationale: |
        Generator sets walls based on adjacency to solid tiles.
        Renderer positions walls at CELL_SIZE/2.0 offsets.
        All logic expects edge positioning.

    ceiling:
      decision: Yes, add ceiling tiles
      rationale: Better enclosed atmosphere

    lighting:
      decision: OmniLight3D attached to camera
      rationale: |
        Simulates player carrying torch.
        omni_range controls visibility distance (8-12 meters).
        Creates claustrophobic atmosphere with limited vision.

    dungeon_size:
      decision: Return to 31x31 after refactor verified working

    gridmap_scope:
      decision: Pure GridMap with 6 separate GridMaps
      implementation:
        - FloorGridMap: floor tiles + stairs markers
        - CeilingGridMap: ceiling tiles
        - NorthWallGridMap, SouthWallGridMap, EastWallGridMap, WestWallGridMap: walls
      rationale: |
        GridMap allows only 1 item per cell, so multiple GridMaps needed.
        Data model is already cell-centric - each tile owns its walls.
        Wall meshes use offset geometry to appear at cell edges.
        No changes needed to generator or movement logic.
        Full performance benefits via instanced rendering.

# =============================================================================
# PHASE 3: COMBAT
# =============================================================================

phase_3:
  name: Combat
  status: Complete
  depends_on: Phase 2 refactor complete

  components:
    combat_scene:
      file: scenes/combat/combat.tscn
      status: Complete
      structure:
        Combat (Control):
          children:
            - Background (TextureRect)
            - EnemyDisplay (Control) - 3x3 grid formation
            - PartyStatus (Control)
            - ActionMenu (VBoxContainer)
            - MessageLog (RichTextLabel)

    combat_system:
      file: systems/combat/combat_system.gd
      status: Complete
      responsibilities:
        - Turn management
        - Action resolution
        - Damage calculation
        - Victory/defeat conditions
        - 3x3 enemy grid positioning
        - Splash/Row/Column targeting

      formulas_preserved:
        hit_roll: d20 + level + (AG/4) >= 10 + target_evasion
        damage: weapon_damage + (ST/4) + bonuses - reduction
        initiative: base + d20 + (AG/divisor) + weapon_speed

    initiative_tracker:
      file: systems/combat/initiative_tracker.gd
      status: Complete
      purpose: Sort combatants by initiative each round

    status_effects:
      file: systems/combat/status_effects.gd
      status: Complete
      effects: [poison, paralysis, sleep, confusion, stone, dead, ashed, lost]

    monster_data:
      files:
        - resources/monster.gd
        - data/monsters/monster_database.gd
      status: Complete
      properties: [name, hp, attack, defense, speed, abilities, loot_table]
      monsters_implemented: [slime, goblin, kobold, orc, spider, witch]

    spell_system:
      files:
        - resources/spell.gd
        - resources/spell_effect.gd
        - data/spells/spell_database.gd
      status: Complete
      schools: [Mage, Priest, Alchemist, Psionic]
      targeting_types:
        SELF: Caster only
        SINGLE_ALLY: One party member
        SINGLE_ENEMY: One enemy
        ALL_ALLIES: Entire party
        ALL_ENEMIES: All enemies
        DEAD_ALLY: One dead party member
        SPLASH: Target enemy + all adjacent (including diagonals)
        ROW: All enemies in selected row (Front/Mid/Back)
        COLUMN: All enemies in selected column (Left/Center/Right)
      spell_count: 45 total across all schools
      naming_convention: Plain English names themed by school

  transitions:
    enter_combat:
      trigger: Random encounter or scripted event in dungeon
      flow:
        1: GameState.start_combat(encounter_data)
        2: SceneManager.go_to_combat(encounter_data)
        3: Combat scene _ready() sets up from encounter_data

    exit_combat:
      victory:
        1: Award XP and loot
        2: GameState.end_combat(true)
        3: SceneManager.return_from_combat()
        4: Return to dungeon at same position

      defeat:
        1: Handle party wipe logic
        2: GameState.end_combat(false)
        3: Return to town or game over

# =============================================================================
# PHASE 4: TOWN
# =============================================================================

phase_4:
  name: Town
  status: Partially complete
  depends_on: Phase 3 complete

  buildings:
    tavern:
      purpose: Assemble active party from roster
      max_party_size: 6

    training_grounds:
      purpose: Create characters, manage roster
      max_roster_size: 50
      functions: [create_character, view_roster, delete_character]

    shop:
      purpose: Buy/sell equipment, upgrades, identification, uncursing
      status: Complete
      functions:
        buy: Purchase items from shop inventory
        sell: Sell items for gold (multi-select supported)
        upgrade: Spend scrap to upgrade equipment stats (+1 to +5 cap)
        scrap: Break down items for 1-2 scrap each (multi-select supported)
        identify: Reveal unidentified item stats (50% of item value)
        uncurse: Remove cursed equipment (100% of item value, destroys item)

    inn:
      purpose: Rest and heal
      functions: [rest_party, heal_status]

    temple:
      purpose: Resurrect dead, cure conditions
      functions: [resurrect, cure_status, tithe]

  equipment_system:
    status: Complete
    files:
      - resources/item.gd
      - resources/party.gd (scrap tracking)
      - resources/character.gd (cursed item handling)
      - scenes/town/shop.gd
      - scenes/town/equipment.gd
      - scenes/common/inventory_screen.gd

    identification:
      unidentified_display: "??? Weapon" format
      shop_identify_cost: 50% of item buy_price
      bishop_identify: Free, from Inventory screen (press I)
      equip_unidentified: Allowed (risky - might be cursed)

    cursed_items:
      behavior: Cannot unequip once worn
      uncurse_cost: 100% of item buy_price
      uncurse_result: Item destroyed, slot freed
      equipment_screen: Shows [CURSED] marker, blocks unequip

    upgrade_system:
      resource: Scrap (party resource like gold)
      scrap_yield: 1-2 per scrapped item (random)
      upgrade_cap: +5 per stat
      upgrade_costs: [2, 4, 8, 16, 32] scrap for +1 through +5
      display_format: "Long Sword +2 [A1 D1]"
      stats_by_type:
        weapon: [accuracy, damage]
        armor: [defense]
        shield: [defense, evasion]
        helmet: [defense]
        gloves: [accuracy]
        boots: [evasion]
        accessory: [hp, mp, strength, intelligence, piety, vitality, agility, luck]
      cursed_restriction: Cannot upgrade cursed items

    equipment_restrictions:
      status: Complete
      class_categories:
        HEAVY_MELEE: [Fighter, Valkyrie, Samurai, Lord, Ranger]
        STAFF: [Mage, Priest, Psionic, Alchemist, Bishop, Bard, Monk]
        HEAVY_ARMOR: [Fighter, Valkyrie, Samurai, Lord]
        MEDIUM_ARMOR: [Fighter, Ranger, Thief, Ninja, Valkyrie, Samurai, Lord, Monk, Bard]
        SHIELD: [Fighter, Ranger, Bishop, Valkyrie, Samurai, Lord]
      race_categories:
        LARGE_RACES: [Human, Elf, Dwarf, Lizman, Dracon, Rawulf, Mook, Felpurr]
        SMALL_RACES: [Faerie, Hobbit, Gnome]
      restrictions_applied:
        - Daggers: No restrictions
        - Swords/Axes/Maces/Spears/Bows: HEAVY_MELEE classes
        - Staves: STAFF classes
        - Heavy gear (Plate, Chain, Iron Helm/Boots/Shield): HEAVY_ARMOR + LARGE_RACES
        - Medium armor (Leather): MEDIUM_ARMOR classes
        - Light gear (Cloth, Leather Cap/Gloves/Boots): No restrictions

  ui_system:
    key_binding_helper:
      status: Complete
      file: systems/ui/key_binding_helper.gd
      purpose: Dynamic help text based on actual key bindings
      methods:
        - get_action_key(action): Returns bound key as readable string
        - get_nav_help(): "Up/Down: Navigate" style text
        - get_horizontal_help(): "Left/Right: Switch" style text
        - get_confirm_help(): "Enter: Select" style text
        - get_cancel_help(): "Esc: Back" style text
        - get_arrow_nav_help(): 4-way navigation text
      used_in:
        - scenes/town/shop.gd
        - scenes/town/formation.gd
        - scenes/town/equipment.gd
        - scenes/common/party_menu.gd
        - scenes/common/inventory_screen.gd

  character_system:
    character_resource:
      file: resources/character.gd
      properties:
        identity: [id, name, race, class, alignment, gender, age]
        stats: [strength, intelligence, piety, vitality, agility, luck]
        combat: [level, experience, hp, max_hp, mp, max_mp, status]
        equipment: [inventory, equipped, spells_known]
        meta: [death_count, created_date]

    roster_resource:
      file: resources/character_roster.gd
      purpose: All characters ever created
      max_size: 50

    party_resource:
      file: resources/party.gd
      purpose: Active adventuring party
      max_size: 6
      properties: [characters, gold, formation]

  character_creation:
    flow:
      1: Choose race (11 options)
      2: Choose class (14 options, filtered by race)
      3: Choose alignment (good/neutral/evil)
      4: Roll stats (reroll allowed)
      5: Choose gender
      6: Enter name
      7: Add to roster

