# DRPG2 Godot Port - Implementation Plan
# This is the authoritative reference for architecture and implementation.
# Edit sections as decisions are made or work is completed.

meta:
  project: drpg-gd
  source: ~/Documents/the4ofus/repos/drpg2/
  godot_version: "4.5"
  language: GDScript (strict static typing)
  last_updated: 2026-01-26

# =============================================================================
# CORE DECISIONS
# =============================================================================

decisions:
  rendering:
    choice: GridMap-based 3D
    rationale: |
      Native Godot tool for grid-based 3D levels.
      Instanced rendering, built-in collision, MCP tooling support.
    not_chosen:
      - Pre-rendered 2D views (inflexible)
      - Shader raycasting (complex)
      - Procedural MeshInstance3D (not idiomatic, performance issues)

  movement:
    choice: Grid-based instant steps
    behavior:
      - Forward/backward moves one cell instantly
      - Left/right rotates 90 degrees instantly
      - No interpolation initially (can add as polish)
    rationale: Matches classic Wizardry feel, simpler to implement

  scene_transitions:
    choice: Always use SceneManager
    rationale: |
      Clean state on each scene load.
      _ready() runs fresh with predictable initialization.
      No race conditions from deferred cleanup.
    applies_to:
      - Main menu to town
      - Town to dungeon
      - Dungeon floor to floor (NOT in-place reload)
      - Dungeon to combat
      - Combat back to dungeon

  data_persistence:
    choice: Resource-based with GameState caching
    pattern: |
      GameState (autoload) holds runtime data.
      Resources for serializable data (characters, dungeons, items).
      SaveManager handles disk serialization.

  class_references:
    choice: Use class_name, fix underlying issues
    issue: |
      Currently using preload() workarounds because class_name resolution failed.
      This indicates project structure or dependency issues to fix.
    fix: Ensure no circular dependencies, proper script loading order

# =============================================================================
# PROJECT STRUCTURE
# =============================================================================

structure:
  autoload:
    game_state.gd:
      purpose: Global runtime state
      contains:
        - current_mode (enum)
        - current_floor (int)
        - party (Resource)
        - roster (Resource)
        - dungeon_floors (Dictionary cache)
        - dungeon_spawn_at_stairs_up (bool)
      signals:
        - floor_changed(new_floor)
        - combat_started(encounter_data)
        - combat_ended(victory)
        - party_member_died(character)
        - game_saved()
        - game_loaded()

    scene_manager.gd:
      purpose: All scene transitions
      methods:
        - go_to_main_menu()
        - go_to_town()
        - go_to_dungeon(floor_num, spawn_at_stairs_up)
        - go_to_combat(encounter_data)
        - return_from_combat()
      implementation: Uses get_tree().change_scene_to_file()

    audio_manager.gd:
      purpose: Music and SFX playback
      status: Stub for now, implement in Phase 5

    save_manager.gd:
      purpose: Save/load game state to disk
      status: Stub for now, implement in Phase 5

  scenes:
    main_menu/:
      files: [main_menu.tscn, main_menu.gd]
      status: Done (basic)

    town/:
      files: [town.tscn, town.gd]
      status: Done (basic placeholder)
      todo: Phase 4 - full town implementation

    dungeon/:
      files:
        - dungeon.tscn
        - dungeon.gd
        - dungeon_meshes.tres (MeshLibrary)
      status: Needs refactor to GridMap

    combat/:
      files: [combat.tscn, combat.gd]
      status: Placeholder only
      todo: Phase 3 implementation

  systems:
    dungeon/:
      dungeon_generator.gd:
        purpose: Procedural dungeon generation
        status: Done, working correctly
        output: DungeonData Resource

    combat/:
      todo: Phase 3
      files_planned:
        - combat_system.gd
        - initiative_tracker.gd
        - status_effects.gd

    magic/:
      todo: Phase 3
      files_planned:
        - spell_caster.gd
        - spell_registry.gd

  resources:
    dungeon_tile.gd:
      status: Done
      purpose: Single tile with wall flags, special type

    dungeon_room.gd:
      status: Done
      purpose: Room bounds and metadata

    dungeon_data.gd:
      status: Done
      purpose: Complete floor data

    character.gd:
      status: Not started
      todo: Phase 4

    party.gd:
      status: Not started
      todo: Phase 4

    monster.gd:
      status: Not started
      todo: Phase 3

  entities:
    purpose: Runtime entity classes (if needed beyond Resources)
    status: May not be needed - evaluate during implementation

  data:
    purpose: Static game data as .tres files
    subdirs: [races, classes, monsters, items, spells, encounters]
    status: Not started
    todo: Phase 3-4 as needed

