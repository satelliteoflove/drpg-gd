    severity: Medium
    description: class_name not resolving, using preload() workarounds
    affected_files:
      - scenes/dungeon/dungeon.gd
      - systems/dungeon/dungeon_renderer.gd
    fix: Review for circular dependencies after GridMap refactor

  stale_error_buffer:
    severity: Low
    description: Godot error buffer persists old errors across runs
    workaround: Reload project to clear
    note: MCP enhancement could add clear_errors action

  test_signals_reference:
    severity: Low
    description: Stale reference to deleted test_signals.gd
    fix: Find and remove reference in scene files

