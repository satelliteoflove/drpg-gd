name: Export Game

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

env:
  GODOT_VERSION: "4.6"

jobs:
  build-llm:
    name: Build LLM Extension (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            cmake_flags: -DGGML_METAL=ON
          - platform: linux
            os: ubuntu-24.04
            cmake_flags: -DGGML_VULKAN=ON
          - platform: windows
            os: windows-2022
            cmake_flags: -DGGML_VULKAN=ON
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Vulkan SDK (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools glslc patchelf

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK $ver"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        working-directory: gdextension
        run: cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: gdextension
        run: cmake --build build --config Release --parallel 4

      - name: Collect binaries (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          cp gdextension/build/libdrpg_llm.macos.template_release.universal.dylib dist/
          cp gdextension/build/libdrpg_llm.macos.template_release.universal.dylib dist/libdrpg_llm.macos.template_debug.universal.dylib
          install_name_tool -id @rpath/libdrpg_llm.macos.template_debug.universal.dylib dist/libdrpg_llm.macos.template_debug.universal.dylib
          for lib in libllama.0.dylib libggml.0.dylib libggml-base.0.dylib libggml-cpu.0.dylib libggml-metal.0.dylib libggml-blas.0.dylib; do
            cp -L gdextension/build/bin/$lib dist/
          done
          for f in dist/*.dylib; do
            install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true
            codesign --force --sign - "$f"
          done

      - name: Collect binaries (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp gdextension/build/libdrpg_llm.linux.template_release.x86_64.so dist/
          cp dist/libdrpg_llm.linux.template_release.x86_64.so dist/libdrpg_llm.linux.template_debug.x86_64.so
          for lib in libllama libggml libggml-base libggml-cpu libggml-vulkan; do
            found=$(find gdextension/build/bin -name "${lib}.so*" \( -type f -o -type l \) | head -1)
            if [ -n "$found" ]; then
              real=$(readlink -f "$found")
              cp "$real" "dist/${lib}.so"
              # Create versioned symlinks the dynamic linker expects
              for versioned in $(find gdextension/build/bin -name "${lib}.so.*" -type l 2>/dev/null); do
                ln -sf "${lib}.so" "dist/$(basename $versioned)"
              done
            fi
          done
          for f in dist/*.so; do
            patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done

      - name: Collect binaries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Write-Host "Searching for built DLLs..."
          Get-ChildItem -Path gdextension/build -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          $ext = Get-ChildItem -Path gdextension/build -Recurse -Filter "drpg_llm.windows.template_release.x86_64.dll" | Select-Object -First 1
          if (-not $ext) { Write-Error "Extension DLL not found"; exit 1 }
          Copy-Item $ext.FullName dist/
          Copy-Item $ext.FullName dist/drpg_llm.windows.template_debug.x86_64.dll
          Get-ChildItem -Path gdextension/build -Recurse -Filter "*.dll" | Where-Object { $_.Name -match "^(llama|ggml)" } | ForEach-Object {
            Write-Host "  Copying dep: $($_.Name)"
            Copy-Item $_.FullName dist/
          }

      - name: Upload LLM binaries
        uses: actions/upload-artifact@v5
        with:
          name: llm-${{ matrix.platform }}
          path: dist/
          retention-days: 1

  export-windows:
    name: Export Windows
    needs: build-llm
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install runtime deps for GDExtension
        run: apt-get update && apt-get install -y libgomp1 libvulkan1

      - name: Download Windows LLM binaries
        uses: actions/download-artifact@v5
        with:
          name: llm-windows
          path: addons/drpg_llm/bin/

      - name: Download Linux LLM binaries for Godot import
        uses: actions/download-artifact@v5
        with:
          name: llm-linux
          path: addons/drpg_llm/bin/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/drpg-gd.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: build/windows/
          retention-days: 1

  export-macos:
    name: Export macOS
    needs: build-llm
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install runtime deps for GDExtension
        run: apt-get update && apt-get install -y libgomp1 libvulkan1

      - name: Download LLM binaries (macOS + Linux for import)
        uses: actions/download-artifact@v5
        with:
          name: llm-macos
          path: addons/drpg_llm/bin/

      - name: Download Linux LLM binaries for Godot import
        uses: actions/download-artifact@v5
        with:
          name: llm-linux
          path: addons/drpg_llm/bin/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export macOS
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" build/macos/drpg-gd.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: build/macos/
          retention-days: 1

  export-linux:
    name: Export Linux
    needs: build-llm
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install runtime deps for GDExtension
        run: apt-get update && apt-get install -y libgomp1 libvulkan1

      - name: Download LLM binaries
        uses: actions/download-artifact@v5
        with:
          name: llm-linux
          path: addons/drpg_llm/bin/

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/drpg-gd.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: build/linux/
          retention-days: 1

  release:
    name: Create Release
    needs: [export-windows, export-macos, export-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Package archives
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          cd windows
          zip "../drpg-gd-${TAG}-windows.zip" *
          cd ..

          mv macos/drpg-gd.zip "drpg-gd-${TAG}-macos.zip"

          cd linux
          tar czf "../drpg-gd-${TAG}-linux.tar.gz" *
          cd ..

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          body: |
            ## macOS Note

            macOS may report the app as "damaged" because it is not code-signed. To fix, open Terminal and run:

            ```
            xattr -cr /path/to/drpg-gd.app
            ```
          files: |
            drpg-gd-${{ steps.version.outputs.tag }}-windows.zip
            drpg-gd-${{ steps.version.outputs.tag }}-macos.zip
            drpg-gd-${{ steps.version.outputs.tag }}-linux.tar.gz
