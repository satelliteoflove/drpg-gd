name: Export Game

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

env:
  GODOT_VERSION: "4.6"

jobs:
  export-windows:
    name: Export Windows
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/drpg-gd.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/

  export-macos:
    name: Export macOS
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export macOS
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" build/macos/drpg-gd.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/

  export-linux:
    name: Export Linux
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Strip dev-only MCP plugin references
        run: |
          sed -i '/^MCPGameBridge=/d' project.godot
          sed -i '/^\[editor_plugins\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[editor_plugins\]/d' project.godot
          sed -i '/^\[godot_mcp\]/,/^\[/{//!d;}' project.godot
          sed -i '/^\[godot_mcp\]/d' project.godot

      - name: Import project
        run: godot --headless --import

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/drpg-gd.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/

  release:
    name: Create Release
    needs: [export-windows, export-macos, export-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package archives
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          cd windows
          zip "../drpg-gd-${TAG}-windows.zip" *
          cd ..

          mv macos/drpg-gd.zip "drpg-gd-${TAG}-macos.zip"

          cd linux
          tar czf "../drpg-gd-${TAG}-linux.tar.gz" *
          cd ..

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          body: |
            ## macOS Note

            macOS may report the app as "damaged" because it is not code-signed. To fix, open Terminal and run:

            ```
            xattr -cr /path/to/drpg-gd.app
            ```
          files: |
            drpg-gd-${{ steps.version.outputs.tag }}-windows.zip
            drpg-gd-${{ steps.version.outputs.tag }}-macos.zip
            drpg-gd-${{ steps.version.outputs.tag }}-linux.tar.gz
